---
- name: Alpine
  hosts: proxmox_all_lxc:&proxmox_all_running:!proxmox_all_templates
  tags: file_update
  remote_user: root
  port: 2224

  tasks:
    - name: Transfer file from git repo
      ansible.builtin.copy:
        src: ../../files/trusted_keys.pub
        dest: /root/.ssh/authorized_keys
        owner: root
      notify: Restart sshd

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted