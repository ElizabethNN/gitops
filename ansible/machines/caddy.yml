---
- name: Caddy file auto update
  hosts: caddy-alpine-container
  tags: file_update
  remote_user: root
  port: 2224

  tasks:
    - name: Transfer file from git repo
      ansible.builtin.copy:
        src: ../../files/Caddyfile
        dest: /etc/caddy/
        owner: caddy
      notify: Restart caddy

  handlers:
    - name: Restart caddy
      ansible.builtin.service:
        name: caddy
        state: restarted