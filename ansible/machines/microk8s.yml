---
- name: MicroK8s setup
  hosts: microk8s
  remote_user: root
  port: 2224

  vars:
    microk8s_addons:
      - community
      - dns
      - hostpath-storage
      - ingress
      - helm3

    argocd_namespace: argocd
    argocd_chart_src: ../../k8s-applications/argocd
    argocd_chart_dest: /tmp/argocd-chart

  tasks:
    - name: Install MicroK8s
      community.general.snap:
        name: microk8s
        classic: true

    - name: Wait for MicroK8s to be ready
      ansible.builtin.command: microk8s status --wait-ready
      changed_when: false

    - name: Collect enabled addons
      # Runs even with --check so the dry-run summary can diff against real state
      ansible.builtin.command: microk8s status
      register: microk8s_status
      check_mode: false
      changed_when: false

    - name: Parse enabled addons
      ansible.builtin.set_fact:
        # Tolerates both "  dns: enabled" and "  core/dns: enabled" formats
        enabled_addons: "{{ microk8s_status.stdout_lines
          | map('regex_replace', '^\\s*(?:[\\w-]+/)?([\\w-]+): enabled.*$', '\\1')
          | select('in', microk8s_addons)
          | list }}"

    - name: Enable MicroK8s addons
      ansible.builtin.command: microk8s enable {{ item }}
      loop: "{{ microk8s_addons }}"
      loop_control:
        label: "{{ item }}"
      when: item not in enabled_addons

    - name: Check if Argo CD is already running
      # Absent either on a fresh cluster or right after the addon was disabled.
      # Once the "argocd" Application self-manages the chart, this stays
      # "ok" and the bootstrap install below is skipped.
      ansible.builtin.command:
        cmd: microk8s kubectl get deployment argocd-server -n {{ argocd_namespace }}
      register: argocd_deployment
      failed_when: false
      changed_when: false

    - name: Clean up stale chart transfer
      ansible.builtin.file:
        path: "{{ argocd_chart_dest }}"
        state: absent
      when: argocd_deployment.rc != 0

    - name: Transfer Argo CD umbrella chart
      ansible.builtin.copy:
        src: "{{ argocd_chart_src }}/"
        dest: "{{ argocd_chart_dest }}"
        mode: "0644"
        directory_mode: "0755"
      when: argocd_deployment.rc != 0

    - name: Bootstrap Argo CD from the Helm chart
      # Release name "argocd" matches the Argo CD Application name, so the
      # resource names are identical when Argo CD later renders the chart
      # itself and takes ownership.
      # NOTE: after the "argocd" Application becomes Healthy, the leftover
      # helm release secret (sh.helm.release.v1.argocd.*) may be deleted:
      #   microk8s kubectl -n argocd delete secret -l owner=helm,name=argocd
      ansible.builtin.command:
        cmd: microk8s helm3 upgrade --install argocd {{ argocd_chart_dest }} --namespace {{ argocd_namespace }} --create-namespace
      when: argocd_deployment.rc != 0

    - name: Wait for Argo CD to be ready
      ansible.builtin.command:
        cmd: microk8s kubectl wait --for=condition=Available deployment/argocd-server -n {{ argocd_namespace }} --timeout=300s
      changed_when: false

    - name: Transfer app-of-apps manifest
      ansible.builtin.copy:
        src: ../../k8s-applications/app-of-apps.yaml
        dest: /tmp/app-of-apps.yaml
        mode: "0644"

    - name: Apply app-of-apps manifest
      ansible.builtin.command:
        cmd: microk8s kubectl apply -f /tmp/app-of-apps.yaml
      register: app_of_apps_apply
      changed_when: "'configured' in app_of_apps_apply.stdout or 'created' in app_of_apps_apply.stdout"

    - name: Dry-run summary
      ansible.builtin.debug:
        msg: "Addons that would be enabled: {{ microk8s_addons | difference(enabled_addons) }}"
      when: ansible_check_mode
