---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ElizabethNN/gitops.git
    targetRevision: master
    path: k8s-applications
    directory:
      recurse: true
      # argocd/* holds the Helm umbrella chart (Chart.yaml/values.yaml),
      # which is managed by the dedicated "argocd" child Application instead.
      exclude: "{app-of-apps.yaml,argocd/**}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
