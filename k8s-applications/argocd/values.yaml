---
## Overrides for the upstream argo-cd chart (10.20.0 / Argo CD v3.6.3).
## TLS is terminated at Caddy; traffic reaches Argo CD as plain HTTP.

global:
  domain: argocd.kitara.space

configs:
  params:
    # Serve plain HTTP behind the ingress (Caddy handles TLS)
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: public
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

redis:
  image:
    repository: redis
    tag: 8.12-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi

dex:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi

notifications:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
