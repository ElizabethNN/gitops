when:
  - event: push
    branch: master
    path:
      include: ['files/*']
      on_empty: false
  - event: manual

steps:
  - name: ansible apply
    image: nexus.kitara.space/docker-hosted/ansible:latest
    environment:
      SSH_KEY:
        from_secret: ANSIBLE_SSH_KEY
      ANSIBLE_HOST_KEY_CHECKING: "False"
      PROXMOX_TOKEN_ID:
        from_secret: PROXMOX_TOKEN_ID
      PROXMOX_TOKEN_SECRET:
        from_secret: PROXMOX_TOKEN_SECRET
      NTFY_TOPIC:
        from_secret: NTFY_TOPIC
    commands:
      #TODO: create base image and push it to nexus (to simplify pipeline)
      - mkdir -p ~/.ssh
      - echo "$SSH_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - apt install python3-requests python3-proxmoxer
      - ansible-galaxy install -r ./ansible/requirements.yaml
      - ansible-playbook ansible/templates/*.yml -i hosts.proxmox.yml --tags file_update 2>&1 | tee -a /woodpecker/ansible_error.log
      - ansible-playbook ansible/machines/*.yml -i hosts.proxmox.yml --tags file_update 2>&1 | tee -a /woodpecker/ansible_error.log

  - name: send failure notification
    image: alpine/curl
    environment:
      NTFY_TOPIC:
        from_secret: NTFY_TOPIC
    when:
      - status: [ failure ]
    commands:
      - apk add --no-cache bash
      - |
        bash -c '
        MSG="$(shuf -n 1 lines/ansible_fails.txt)"
        ERR=$(tail -n 15 /woodpecker/ansible_error.log 2>/dev/null || echo "no log captured, even the log gave up")
        curl -s \
          -H "Title: Ansible faceplanted" \
          -H "Priority: high" \
          -H "Tags: robot,${CI_REPO_NAME}" \
          -d "$MSG \n\n$ERR" \
          https://ntfy.sh/$${NTFY_TOPIC}
          '
      - exit 1

  - name: send success notification
    image: alpine/curl
    when:
      - status: [ success ]
    environment:
      NTFY_TOPIC:
        from_secret: NTFY_TOPIC
    commands:
      - apk add --no-cache bash
      - |
        bash -c '
        MSG="$(shuf -n 1 lines/ansible_success.txt)"
        curl -s \
          -H "Title: Ansible applied" \
          -H "Priority: default" \
          -H "Tags: white_check_mark,${CI_REPO_NAME}" \
          -d "$MSG" \
          https://ntfy.sh/$${NTFY_TOPIC}
          '

concurrency:
  limit: 1