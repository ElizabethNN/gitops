#cloud-config
hostname: ${hostname}
manage_etc_hosts: true

# Root login with keys only; no default "ubuntu" user
users: []
disable_root: false
ssh_pwauth: false
ssh_authorized_keys: ${jsonencode(ssh_keys)}

package_update: true
packages:
  - qemu-guest-agent
  - prometheus-node-exporter

write_files:
%{ if length(ssh_port) > 0 ~}
  - path: /etc/ssh/sshd_config.d/10-port.conf
    permissions: "0644"
    content: |
      Port ${ssh_port}
%{ endif ~}
  - path: /etc/systemd/resolved.conf.d/99-no-search-domain.conf
    permissions: "0644"
    content: |
      [Resolve]
      DNS=1.1.1.1 8.8.8.8
      Domains=cluster.local
%{ if length(fs_setup) > 0 ~}
fs_setup: ${jsonencode(fs_setup)}
%{ endif ~}
%{ if length(mounts) > 0 ~}
mounts: ${jsonencode(mounts)}
%{ endif ~}

runcmd:
  - systemctl enable --now qemu-guest-agent
  - systemctl enable --now prometheus-node-exporter
  - systemctl restart systemd-resolved
  - systemctl restart ssh

  - sleep 5
  - resolvectl domain eth0 cluster.local
  - systemctl restart systemd-resolved